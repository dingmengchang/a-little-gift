<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快乐，泽豪！🎁</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        /* 针对礼物卡片的额外样式 */
        .gift-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100%; /* 内容高于视口时允许撑开、随 chat-content 滚动 */
            text-align: center;
            padding: 20px;
        }

        .gift-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
            flex-shrink: 0; /* 防止 flex 压缩卡片导致按钮被裁掉 */
        }

        .gift-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .gift-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #f5d78a, #e8b34b, #ff9f68, #ff6b6b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }

        .gift-message {
            font-size: 1.1rem;
            color: var(--text-color);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .reveal-btn {
            background: var(--accent-color);
            color: #201a08;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .reveal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(232, 179, 75, 0.25);
        }

        /* ===== 请客券 ===== */
        .coupon-wrapper {
            display: none; /* 点「查看礼物」后展开 */
            margin-top: 20px;
        }

        .gift-card.revealed .coupon-wrapper {
            display: block;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gift-card.revealed .reveal-btn {
            display: none;
        }

        .coupon {
            display: flex;
            align-items: stretch;
            text-align: left;
            position: relative;
            background: linear-gradient(135deg, #332a15, #262113);
            border: 1px solid rgba(232, 179, 75, 0.45);
            border-radius: 14px;
            margin-bottom: 22px;
        }

        .coupon-left {
            padding: 20px 6px 20px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .coupon-brand {
            font-size: 32px;
            font-weight: 700;
            writing-mode: vertical-rl;
            letter-spacing: 10px;
            background: linear-gradient(180deg, #f5d78a, #e8b34b, #c9862f);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .coupon-no {
            font-size: 11px;
            color: var(--text-muted);
            font-family: monospace;
        }

        .coupon-divider {
            width: 0;
            border-left: 2px dashed rgba(232, 179, 75, 0.5);
            position: relative;
            margin: 12px 18px;
        }

        /* 打孔效果：上下两个「缺口」圆 */
        .coupon-divider::before,
        .coupon-divider::after {
            content: '';
            position: absolute;
            left: -11px;
            width: 20px;
            height: 20px;
            background: var(--card-bg);
            border: 1px solid rgba(232, 179, 75, 0.45);
            border-radius: 50%;
        }

        .coupon-divider::before { top: -22px; }
        .coupon-divider::after { bottom: -22px; }

        .coupon-right {
            flex: 1;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: center;
        }

        .coupon-title {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        .coupon-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .coupon-option {
            background: rgba(232, 179, 75, 0.08);
            border: 1px solid rgba(232, 179, 75, 0.35);
            color: #f0d9a6;
            padding: 8px 14px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .coupon-option:hover {
            background: rgba(232, 179, 75, 0.18);
        }

        .coupon-option.selected {
            background: linear-gradient(135deg, #e8b34b, #d29a35);
            color: #201a08;
            font-weight: 600;
            border-color: transparent;
        }

        .coupon-hint {
            display: none;
            font-size: 12px;
            color: #e5484d;
        }

        .coupon-hint.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .coupon-terms {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
        }

        /* 红色印章 */
        .stamp {
            position: absolute;
            right: 14px;
            top: 10px;
            width: 84px;
            height: 84px;
            border-radius: 50%;
            border: 3px solid #e5484d;
            box-shadow: inset 0 0 0 2px rgba(229, 72, 77, 0.35);
            background: rgba(229, 72, 77, 0.06);
            color: #e5484d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 17px;
            line-height: 1.25;
            letter-spacing: 2px;
            transform: rotate(-12deg) scale(2.2);
            opacity: 0;
            pointer-events: none;
            z-index: 2;
        }

        .coupon.stamped .stamp {
            animation: stampIn 0.45s cubic-bezier(0.2, 1.6, 0.4, 1) forwards;
        }

        @keyframes stampIn {
            0%   { opacity: 0;   transform: rotate(-12deg) scale(2.2); }
            60%  { opacity: 1;   transform: rotate(-12deg) scale(0.92); }
            100% { opacity: 0.92; transform: rotate(-12deg) scale(1); }
        }

        .coupon.stamped .coupon-option {
            pointer-events: none;
        }

        /* 盖章按钮 */
        .stamp-zone {
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stamp-btn {
            background: linear-gradient(135deg, #e8b34b, #d29a35);
            color: #201a08;
            border: none;
            padding: 12px 28px;
            border-radius: 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .stamp-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(232, 179, 75, 0.25);
        }

        .stamp-btn.done {
            opacity: 0.75;
            cursor: default;
        }

        /* 没选餐就想盖章：晃动提醒 */
        .coupon.shake {
            animation: couponShake 0.4s ease;
        }

        @keyframes couponShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-7px); }
            40% { transform: translateX(7px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        /* 动画效果 */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .chat-content {
            padding-bottom: 20px !important; /* 覆盖原来的 padding */
        }

        /* 手机端：券面改为上下布局 */
        @media (max-width: 520px) {
            .coupon {
                flex-direction: column;
            }
            .coupon-left {
                flex-direction: row;
                padding: 18px 24px 2px;
                gap: 14px;
            }
            .coupon-brand {
                writing-mode: horizontal-tb;
                font-size: 26px;
                letter-spacing: 6px;
            }
            .coupon-divider {
                border-left: none;
                border-top: 2px dashed rgba(232, 179, 75, 0.5);
                margin: 10px 24px;
            }
            .coupon-divider::before,
            .coupon-divider::after {
                display: none;
            }
            .gift-card {
                padding: 28px 20px;
            }
        }
    </style>
</head>
<body class="dark-theme">
    <canvas id="fireworksCanvas"></canvas>

    <div class="app-container">
        <!-- 侧边栏 (简化版) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <button class="menu-btn" id="menuBtn">
                    <span class="material-symbols-rounded">menu</span>
                </button>
            </div>

            <div class="sidebar-middle">
                <div class="recent-title">我的礼物</div>
                <div class="history-list">
                    <div class="history-item active">
                        <span class="material-symbols-rounded">redeem</span>
                        <span class="text">请客券 · 请你吃大餐</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-bottom">
                <div class="nav-item">
                    <span class="material-symbols-rounded">info</span>
                    <span class="text">关于这份礼物</span>
                </div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="chat-container">
            <header class="chat-header">
                <div class="header-left">
                    <span class="gemini-logo">Happy Birthday!</span>
                </div>
                <div class="header-right">
                    <button class="icon-btn music-toggle" id="musicToggle">
                        <span class="material-symbols-rounded">music_note</span>
                    </button>
                    <div class="user-avatar">
                        <!-- TODO: 如需换别的头像，替换文件或改这里的 src -->
                        <img src="zehao.jpg" alt="avatar">
                    </div>
                </div>
            </header>

            <div class="chat-content" id="chatContent" style="display: flex; flex-direction: column; justify-content: center;">
                <!-- TODO: 换背景音乐，替换 Liyue.mp3 或改下面 src -->
                <audio id="bgMusic" loop playsinline webkit-playsinline preload="auto">
                    <source src="Liyue.mp3" type="audio/mpeg">
                </audio>

                <div class="gift-container">
                    <div class="gift-card" id="giftCard">
                        <div class="gift-icon">
                            <span class="material-symbols-rounded" style="font-size: 64px; color: #e8b34b; margin-bottom: 20px; width: 64px; height: 64px;">restaurant</span>
                        </div>
                        <h1 class="gift-title">生日快乐，泽豪！</h1>
                        <!-- TODO: 祝福语是占位文案，按你的想法改 -->
                        <p class="gift-message">
                            思来想去，决定送你一份「好吃」的礼物。<br>
                            不是别的，正是一张我亲手签发的——请客券。<br>
                            凭此券可兑换：大渔铁板烧 或 独野和牛寿喜烧（二选一，我买单）。<br>
                            永久有效，想好哪天吃，随时喊我。
                        </p>

                        <div class="coupon-wrapper">
                            <div class="coupon" id="coupon">
                                <div class="coupon-left">
                                    <div class="coupon-brand">请客券</div>
                                    <div class="coupon-no" id="couponNo">NO.2026-0000</div>
                                </div>
                                <div class="coupon-divider"></div>
                                <div class="coupon-right">
                                    <div class="coupon-title">凭此券可兑换（点一个）</div>
                                    <div class="coupon-options">
                                        <button class="coupon-option" data-meal="大渔铁板烧">🍣 大渔铁板烧</button>
                                        <button class="coupon-option" data-meal="独野和牛寿喜烧">🥩 独野和牛寿喜烧</button>
                                    </div>
                                    <div class="coupon-hint" id="couponHint">先选一个想吃的，再盖章哦～</div>
                                    <div class="coupon-terms">
                                        <span>有效期：永久</span>
                                        <span>承诺人：丁丁</span>
                                    </div>
                                </div>
                                <div class="stamp">承诺<br>生效</div>
                            </div>

                            <div class="stamp-zone">
                                <button class="stamp-btn" id="stampBtn">
                                    <span class="material-symbols-rounded" style="font-size: 18px;">approval</span>
                                    盖章收下
                                </button>
                            </div>
                        </div>

                        <button class="reveal-btn" id="revealBtn">
                            <span class="material-symbols-rounded">visibility</span>
                            查看礼物
                        </button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
